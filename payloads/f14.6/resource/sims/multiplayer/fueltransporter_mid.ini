; fueltransporter_mid.ini
;
; Template for medium modular fuel transporter.
;
; Revision control information:
;
; $Header: /iwar2/resource/sims/Multiplayer/fueltransporter_mid.ini 1     17/07/01 16:35 Carl $
;

[Class]
name=icShip

[Avatar]
name=lws:/avatars/fueltransporter/setup_mid

[CollisionHull]
name=collision_hull:/collisionhulls/fueltransporter_mid_hull

[SetupScene]
name=lws:/sims/ships/utility/fueltransporter_mid

[Subsims]

; Dockports
template[0]=ini:/subsims/dockports/refuel_port
null[0]=front_dockport

; Systems
template[1]=ini:/subsims/systems/nonplayer/nps_autorepair_basic
template[2]=ini:/subsims/systems/nonplayer/nps_capsule_drive
template[3]=ini:/subsims/systems/nonplayer/nps_crew
null[3]=crew

[Properties]

; The name of the object
name=ship_type_fuel_transporter_mid

; The threat rating 'points value' of the hull
threat=50

; Damage model properties
hit_points=4500
armour=45

; Sim type (ship class)
type="T_Freighter"

; Docking port prority
docking_priority=200

; Dimensions
width=150
height=40
length=373

; Maximum linear speeds as a vector (m/s)
speed=(50,50,750)

; Maximum linear acceleration as a vector (m/s/s)
acceleration=(10, 10, 40)

; Maximum angular rotation (deg/s)
yaw_rate=15
roll_rate=20
pitch_rate=15

; Maximum angular acceleration (deg/s/s)
yaw_accel=10
roll_accel=15
pitch_accel=10

; Brightness for the sensors to spot
brightness=0.8
min_brightness=0.6


