[Properties]
name=options_default

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; I-War II developer mode commands
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;


[fcGraphicsDeviceD3D.TakeScreenShot]
Keyboard, F12

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; I-War II shell commands
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[SpaceFlight.Pause]
Keyboard, Pause
Keyboard, P

[SpaceFlight.PDA]
Keyboard, Escape

[Options.Leave]
Keyboard, Escape

[GUI.ControlFocusLeft]
Keyboard, Left
Joystick1, JoyPov1Left

[GUI.ControlFocusUp]
Keyboard, Up
Joystick1, JoyPov1Up

[GUI.ControlFocusRight]
Keyboard, Right
Joystick1, JoyPov1Right

[GUI.ControlFocusDown]
Keyboard, Down
Joystick1, JoyPov1Down

[GUI.ControlFocusCancel]
Keyboard, Escape
Joystick1, JoyButton2
Mouse, MouseButton2

[GUI.ControlFocusSelect]
Keyboard, Return
Keyboard, NumPadReturn
Joystick1, JoyButton1

[GUI.HTMLBack]
Keyboard, Backspace

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; I-War II in-flight commands
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Yoke

[icPlayerPilot.Yaw]
Joystick1, JoyXAxis
Mouse, MouseXAxis

[icPlayerPilot.Pitch]
Joystick1, JoyYAxis, inverse
Mouse, MouseYAxis

[icPlayerPilot.Roll]
Joystick1, JoyRZAxis

[icPlayerPilot.RollYawToggleHold]
Joystick1, Joybutton2

; Throttle

[icPlayerPilot.Throttle]
Joystick1, JoyZAxis, inverse
Joystick1, JoyUAxis, inverse

[icPlayerPilot.ThrottleDelta]
Keyboard, Equals
Keyboard, Minus, inverse

;  Thrusters

[icPlayerPilot.LateralX]
Keyboard, D
Keyboard, A, inverse
Joystick1, JoyXAxis, ALT

[icPlayerPilot.LateralY]
Joystick1, JoyYAxis, ALT

[icPlayerPilot.LateralZ]
Keyboard, W
Keyboard, S, inverse
Joystick1, Joybutton7
Joystick1, Joybutton8, inverse

; Fly-by-wire modes

[icPlayerPilot.FreeHold]
Keyboard, LeftControl

[icPlayerPilot.FreeToggle]
Keyboard, N

; Fire control

[icPlayerPilot.CurrentWeaponFire]
Joystick1, JoyButton1
Keyboard, Space

[icPlayerPilot.LDSIQuickFire]
Keyboard, I

[icPlayerPilot.ToggleAimAssist]
Keyboard, X

[icPlayerPilot.ToggleZoom]
Keyboard, Z

[icPlayerPilot.ToggleWeaponLinkingMode]
Keyboard, F


; LDS drive

[icPlayerPilot.ToggleLDS]
Keyboard, L

; Docking

[icPlayerPilot.Undock]
Keyboard, U

; Targetting

[icPlayerPilot.CycleContactUp]
Keyboard, Comma
Joystick1, JoyButton6
Joystick1, JoyButton3, SHIFT

[icPlayerPilot.CycleContactDown]
Keyboard, Dot
Joystick1, JoyButton5
Joystick1, JoyButton4, SHIFT

[icPlayerPilot.CycleContactTop]
Keyboard, Home

[icPlayerPilot.CycleContactBottom]
Keyboard, End

[icPlayerPilot.TargetNearestEnemy]
Keyboard, R

[icPlayerPilot.TargetNearestShipToDirection]
Keyboard, T
Joystick1, JoyButton2

[icPlayerPilot.TargetLastAggressor]
Keyboard, Q

[icPlayerPilot.SubTarget]
Keyboard, Y

[icPlayerPilot.CycleEnemy]
Keyboard, E

[icPlayerPilot.CycleCritical]
Keyboard, C

; Weapon cycling

[icPlayerPilot.NextWeapon]
Keyboard, RightBracket

[icPlayerPilot.NextPrimaryWeapon]
Keyboard, Return
Joystick1, JoyButton4

[icPlayerPilot.NextSecondaryWeapon]
Keyboard, Backspace
Joystick1, JoyButton3

; Engineering

[icPlayerPilot.PowerToOffensive]
Keyboard, Left, SHIFT

[icPlayerPilot.PowerToDefensive]
Keyboard, Right, SHIFT

[icPlayerPilot.PowerToDrive]
Keyboard, Down, SHIFT

[icPlayerPilot.BalancePower]
Keyboard, Up, SHIFT

; Autopilots

[icPlayerPilot.AutopilotOff]
Keyboard, F5

[icPlayerPilot.AutopilotApproach]
Keyboard, F6

[icPlayerPilot.AutopilotFormate]
Keyboard, F7

[icPlayerPilot.AutopilotDock]
Keyboard, F8

[icPlayerPilot.AutopilotMatchVelocity]
Keyboard, F9

[icPlayerPilot.RemotePilot]
Keyboard, R, SHIFT


; Camera selection

[icDirector.InternalCamera]
Keyboard, F1

[icDirector.TacticalCamera]
Keyboard, F2

[icDirector.ExternalCamera]
Keyboard, F3

[icDirector.DropCamera]
Keyboard, F4

[icDirector.AutoMode]
Keyboard, F11

; Camera control

[icDirector.Pan]
Keyboard, NumPad6
Keyboard, NumPad4, inverse

[icDirector.Tilt]
Keyboard, NumPad8
Keyboard, NumPad2, inverse

[icDirector.Roll]
Keyboard, NumPad7
Keyboard, NumPad9, inverse

[icDirector.Zoom]
Keyboard, NumPadPlus, inverse
Keyboard, NumPadMinus

[icDirector.ZoomToFit]
Mouse, MouseButton3
Keyboard, NumPadStar

[icDirector.MouseDeltaPan]
Mouse, MouseXAxis, inverse

[icDirector.MouseDeltaTilt]
Mouse, MouseYAxis

[icDirector.MouseDeltaZoom]
Mouse, MouseZAxis, inverse

[icDirector.MouseRollModifier]
Mouse, MouseButton2

[icDirector.MouseZoomModifier]
Mouse, MouseButton1

[icDirector.Skip]
Keyboard, Space

; Game controls

[Game.PauseSimulation]
Keyboard, Pause
Keyboard, P

[Game.MovieSkip]
Keyboard, Space
Keyboard, Escape
Keyboard, Return

; PDA control

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; iWar2 HUD commands
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[HUD.MenuLeft]
Keyboard, Left
Joystick1, JoyPOV1Left

[HUD.MenuRight]
Keyboard, Right
Joystick1, JoyPOV1Right

[HUD.MenuUp]
Keyboard, Up
Joystick1, JoyPOV1Up

[HUD.MenuDown]
Keyboard, Down
Joystick1, JoyPOV1Down

[HUD.MenuSelect]
Keyboard, Return
Joystick1, JoyButton1

[HUD.MenuCancel]
Keyboard, Backspace
Joystick1, JoyButton2

[HUD.Objectives]
Keyboard, O, SHIFT

[HUD.Starmap]
Keyboard, M, SHIFT

[HUD.Log]
Keyboard, L, SHIFT

[HUD.Engineering]
Keyboard, E, SHIFT

[HUD.Statistics]
Keyboard, S, SHIFT

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; iWar2 comms commands
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[icComms.PrevResponse]
Keyboard, Up
Joystick1, JoyPOV1Up

[icComms.NextResponse]
Keyboard, Down
Joystick1, JoyPOV1Down

[icComms.SayResponse]
Keyboard, Space
Keyboard, Return
Joystick1, JoyButton1

[icComms.SkipPhrase]
Keyboard, Delete

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Generic Flux input commands.
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[PointerX]
Mouse, MouseAbsXAxis

[PointerY]
Mouse, MouseAbsYAxis

[PointerZ]
Mouse, MouseZAxis

[PointerButton1]
Mouse, MouseButton1

[PointerButton2]
Mouse, MouseButton2

[PointerButton3]
Mouse, MouseButton2

; Script Bindings ;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[ScriptKeys.StartJafsScript]
Keyboard, J

; Cutscene accessor

[ScriptKeys.SkipCutscene]
Keyboard, Space

; Wingmen Commands 

[ScriptKeys.WingmenReportStatus]
Keyboard, 1

[ScriptKeys.WingmenDefendPlayer]
Keyboard, 2

[ScriptKeys.WingmenAttackTarget]
Keyboard, 3

[ScriptKeys.WingmenDefendTarget]
Keyboard, 4

[ScriptKeys.WingmenDockToTarget]
Keyboard, 5

[ScriptKeys.WingmenHalt]
Keyboard, 6

; T-Fighter Commands

[ScriptKeys.TFighterAttachDetach]
Keyboard, 0

[ScriptKeys.TFighterCeaseFire]
Keyboard, 7

[ScriptKeys.TFighterAttackTarget]
Keyboard, 8

[ScriptKeys.TFighterFireAtWill]
Keyboard, 9

; Demo Commands

[ScriptKeys.NextPlayerShip]
Keyboard, PageUp

[ScriptKeys.PreviousPlayerShip]
Keyboard, PageDown


; Multiplayer Commands

[Multiplayer.Score]
Keyboard, Tab

[ScriptKeys.MultiplayerSay]
Keyboard, Backquote

[ScriptKeys.MultiplayerTeamSay]
Keyboard, Backquote, SHIFT

[ScriptKeys.MultiplayerAutoTaunt1]
Keyboard, 1, SHIFT

[ScriptKeys.MultiplayerAutoTaunt2]
Keyboard, 2, SHIFT

[ScriptKeys.MultiplayerAutoTaunt3]
Keyboard, 3, SHIFT

[ScriptKeys.MultiplayerAutoTaunt4]
Keyboard, 4, SHIFT

